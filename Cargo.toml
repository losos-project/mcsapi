[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/mcsapi"

[workspace.dependencies]
mcsapi = { path = "crates/mcsapi", version = "0.1.0" }
mcsapi-ui = { path = "crates/mcsapi-ui", version = "0.1.0" }
mcsapi-theme = { path = "crates/mcsapi-theme", version = "0.1.0" }
mcsapi-runtime = { path = "crates/mcsapi-runtime", version = "0.1.0" }
mcsapi-components = { path = "crates/mcsapi-components", version = "0.1.0" }
mcsapi-components-gpui = { path = "crates/mcsapi-components-gpui", version = "0.1.0" }
mcsapi-compositor = { path = "crates/mcsapi-compositor", version = "0.1.0" }
mcsapi-hardened-malloc = { path = "crates/mcsapi-hardened-malloc", version = "0.1.0" }
egui = "0.36.2"
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Zed's in-tree GPUI, not the crates.io release: Zed's `ui` components
# (vendored as mcsapi-zed-ui) are written against it. GPUI no longer contains
# a platform; `gpui_platform` picks Wayland or X11 at run time. This is the
# upstream commit Sonne's fork was based on. It came from Sonne until that
# repository stopped being public; nothing here used the fork's two changes,
# its mcsapi window backend and `Background::paint`.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", features = ["font-kit", "wayland", "x11"] }
# Zed crates the vendored components use alongside GPUI, at GPUI's revision
# so they share its types.
collections = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
refineable = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
syntax_theme = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
# Zed's component stack, copied from Sonne. Each keeps Zed's library name
# (`ui`, `theme`, ...) so the copied sources compile unchanged.
mcsapi-zed-component = { path = "crates/mcsapi-zed-component", version = "0.1.0" }
mcsapi-zed-icons = { path = "crates/mcsapi-zed-icons", version = "0.1.0" }
mcsapi-zed-menu = { path = "crates/mcsapi-zed-menu", version = "0.1.0" }
mcsapi-zed-theme = { path = "crates/mcsapi-zed-theme", version = "0.1.0" }
mcsapi-zed-ui = { path = "crates/mcsapi-zed-ui", version = "0.1.0" }
mcsapi-zed-ui-macros = { path = "crates/mcsapi-zed-ui-macros", version = "0.1.0" }
libc = "0.2"
# Libraries emit `tracing` events and leave where they go to the binary that
# links them; binaries install a `tracing-subscriber` writing to stderr.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Errors are `thiserror` types that also derive `miette::Diagnostic`. Without
# `fancy` here, so a library pulls in no terminal rendering; binaries turn it on.
miette = "7.6.0"
thiserror = "2"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }

# Zed patches these for GPUI, and a git dependency's own [patch] section does
# not apply to the workspace that depends on it, so every workspace that builds
# Sonne's GPUI repeats them: GPUI's executor needs the async-task fork's
# metadata API, and its Linux event loop needs the calloop fork.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }


# One codegen unit and fat LTO across every crate: release builds are the ones
# that ship (derisk links all of this into one binary), so they trade build
# time for inlining across crate boundaries and a smaller binary.
[profile.release]
lto = true
codegen-units = 1
