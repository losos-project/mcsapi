name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from new toolchains and advisories.
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Actions are pinned to commits, with the tag or branch beside each: a tag can
# be moved by whoever controls the action's repository, and a moved
# rust-cache tag could poison the cache main's builds restore.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Packages Smithay needs for the default build and the bare-seat `kms`
  # feature (libinput, udev, GBM, libseat, libdrm).
  BASE_PACKAGES: libxkbcommon-dev pkg-config libinput-dev libudev-dev libgbm-dev libseat-dev libdrm-dev
  # Extra packages the native Wayland GPUI integration needs.
  GPUI_PACKAGES: >-
    libwayland-dev libxkbcommon-x11-dev libfontconfig1-dev libssl-dev
    libvulkan-dev
  # mcsapi-hardened-malloc links the system's libhardened_malloc.so, which
  # Ubuntu does not package; the jobs that link the workspace build release 14
  # (tag 14), by commit: the repository also has a branch named 14, which a
  # `clone --branch 14` picks instead.
  HARDENED_MALLOC_COMMIT: 3bee8d3e0e4fd82b684521891373f40ab4982a5a

jobs:
  # Whether the change can affect the code (.github/changes): one that only
  # edits text, editor settings or another workflow skips the jobs below, and
  # the security audit runs on a pull request only when the dependencies
  # changed, since an advisory published meanwhile is no fault of the pull
  # request's and main and the weekly run audit anyway. `CI success` accepts
  # the skips; if this job fails, it fails too.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      deps: ${{ steps.changes.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: .github/changes .github/workflows/ci.yml >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, gpui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BASE_PACKAGES \
            ${{ matrix.features == 'gpui' && '$GPUI_PACKAGES' || '' }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.features }}
      - name: Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets
          --features mcsapi-compositor/hotpatch,mcsapi-compositor/kms
          ${{ matrix.features == 'gpui' && '--features mcsapi/gpui,mcsapi-components-gpui/gpui,mcsapi-gallery/gpui' || '' }}
          -- -D warnings

  # The egui toolkit also runs in a browser (derisk's web demo builds the
  # core apps for wasm32), so it has to keep building without Smithay.
  wasm:
    name: Toolkit on wasm32
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: >-
          cargo clippy --locked --target wasm32-unknown-unknown
          -p mcsapi-ui -p mcsapi-components -p mcsapi-runtime -p mcsapi-theme
          -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "msrv" tracks workspace.package.rust-version in the root Cargo.toml.
        toolchain: [stable, beta, msrv]
        features: [default, gpui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BASE_PACKAGES \
            ${{ matrix.features == 'gpui' && '$GPUI_PACKAGES' || '' }}
      - name: Build hardened_malloc
        run: |
          dir="$RUNNER_TEMP/hardened_malloc"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 \
            https://github.com/GrapheneOS/hardened_malloc "$HARDENED_MALLOC_COMMIT"
          git -C "$dir" checkout --quiet FETCH_HEAD
          # No -march=native: rust-cache can restore the build on another CPU.
          make -C "$dir" -j"$(nproc)" CONFIG_NATIVE=false
          echo "HARDENED_MALLOC_LIB_DIR=$dir/out" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/out" >> "$GITHUB_ENV"
      - name: Resolve toolchain
        id: toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = msrv ]; then
            echo "name=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ matrix.toolchain }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}
      - name: Build
        run: >-
          cargo build --locked --workspace --all-targets --features mcsapi-compositor/kms
          ${{ matrix.features == 'gpui' && '--features mcsapi/gpui,mcsapi-components-gpui/gpui,mcsapi-gallery/gpui' || '' }}
      - name: Test
        run: >-
          cargo test --locked --workspace --all-targets --features mcsapi-compositor/kms
          ${{ matrix.features == 'gpui' && '--features mcsapi/gpui,mcsapi-components-gpui/gpui,mcsapi-gallery/gpui' || '' }}
      # `--doc` runs a library's doc examples even when its manifest sets
      # `doctest = false`, so the packages that opt out (the vendored Zed
      # crates, whose examples name crates they do not depend on) are read
      # from cargo metadata and excluded.
      - name: Doc tests
        run: >-
          cargo test --locked --workspace --doc
          $(cargo metadata --locked --no-deps --format-version 1
          | jq -r '.packages[] | select(all(.targets[]; .doctest | not)) | "--exclude \(.name)"')
          ${{ matrix.features == 'gpui' && '--features mcsapi/gpui,mcsapi-components-gpui/gpui,mcsapi-gallery/gpui' || '' }}
      - name: Run headless example
        if: matrix.features == 'default'
        run: cargo run --locked -p mcsapi --example desktop

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BASE_PACKAGES $GPUI_PACKAGES
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --locked --workspace --no-deps
      - run: cargo doc --locked --workspace --no-deps --features mcsapi/gpui,mcsapi-components-gpui/gpui,mcsapi-gallery/gpui

  coverage:
    name: Coverage
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BASE_PACKAGES
      - name: Build hardened_malloc
        run: |
          dir="$RUNNER_TEMP/hardened_malloc"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 \
            https://github.com/GrapheneOS/hardened_malloc "$HARDENED_MALLOC_COMMIT"
          git -C "$dir" checkout --quiet FETCH_HEAD
          # No -march=native: rust-cache can restore the build on another CPU.
          make -C "$dir" -j"$(nproc)" CONFIG_NATIVE=false
          echo "HARDENED_MALLOC_LIB_DIR=$dir/out" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/out" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Collect coverage
        run: cargo llvm-cov --locked --workspace --all-targets --lcov --output-path lcov.info
      - name: Summarize coverage
        run: |
          {
            echo '## Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  audit:
    name: Security audit
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit

  nix:
    name: Nix flake
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Clippy, tests and docs for the default and GPUI builds, rustfmt, the
      # headless example and every package; see `checks` in flake.nix.
      - run: nix flake check -L
      - name: Dev shell
        run: nix develop -i -k TERM -k HOME -c cargo --version

  ci-success:
    name: CI success
    if: always()
    needs: [changes, fmt, clippy, wasm, test, docs, coverage, audit, nix]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
