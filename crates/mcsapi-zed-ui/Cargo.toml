# Copied from Zed's `ui` crate (github.com/dasmatus/sonne, crates/ui). Its
# theme is mcsapi-zed-theme, which takes its colors from an mcsapi theme, and
# its icons are mcsapi-zed-icons, which embeds the SVGs they name.
[package]
name = "mcsapi-zed-ui"
description = "Zed's GPUI component library, themed from an mcsapi theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
name = "ui"
path = "src/ui.rs"
# As in Zed: the doc examples name crates and derives these copies do not
# depend on, so they are documentation, not tests.
doctest = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
documented = "0.10"
gpui = { workspace = true, optional = true }
gpui_macros = { workspace = true, optional = true }
gpui_util = { workspace = true, optional = true }
itertools = "0.15.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mcsapi-zed-component.workspace = true
mcsapi-zed-icons.workspace = true
mcsapi-zed-menu.workspace = true
mcsapi-zed-theme.workspace = true
mcsapi-zed-ui-macros.workspace = true
num-format = "0.4.4"
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
web-time = "1.1.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
# Everything here is GPUI elements; off by default like every other GPUI crate
# in the workspace, so the workspace builds without GPUI's system libraries.
gpui = [
    "dep:gpui",
    "dep:gpui_macros",
    "dep:gpui_util",
    "mcsapi-zed-component/gpui",
    "mcsapi-zed-menu/gpui",
    "mcsapi-zed-theme/gpui",
]

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

# Zed's doc comments link items these copies leave out and carry bare URLs;
# Zed does not check its docs with rustdoc's lints, so neither do the copies.
[lints.rustdoc]
all = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
