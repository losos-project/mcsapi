# Copied from Zed's `ui_macros` crate (github.com/dasmatus/sonne, crates/ui_macros).
[package]
name = "mcsapi-zed-ui-macros"
description = "Zed's derive macros for its ui components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[lib]
name = "ui_macros"
path = "src/ui_macros.rs"
# As in Zed: the doc examples name crates and derives these copies do not
# depend on, so they are documentation, not tests.
doctest = false
proc-macro = true
test = false

[dependencies]
quote = "1.0.9"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit-mut"] }

# Zed's workspace lints, which this code was written against: style lints stay
# off so the copy can track Zed's source without local rewrites.
[lints.rust]
unexpected_cfgs = { level = "allow" }

# Zed's doc comments link items these copies leave out and carry bare URLs;
# Zed does not check its docs with rustdoc's lints, so neither do the copies.
[lints.rustdoc]
all = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
